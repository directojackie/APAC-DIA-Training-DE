version: 2

models:
# Tests for orders_lines
  - name: orders_lines
    description: "Incremental model for order line items with pricing, discount, and tax details."
    columns:
      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - not_null
          - unique

      - name: line_number
        description: "Line item number within the order."
        tests:
          - not_null

      - name: product_id
        description: "Identifier for the product in the line item."
        tests:
          - not_null

      - name: quantity
        description: "Quantity of the product ordered."
        tests:
          - not_null

      - name: unit_price
        description: "Unit price of the product at the time of order."

      - name: line_discount_pct
        description: "Discount percentage applied to the line item."

      - name: tax_pct
        description: "Tax percentage applied to the line item."

      - name: ingestion_ts
        description: "Timestamp when the record was ingested into the bronze layer."
        tests:
          - not_null

  # Tests for orders
  - name: orders_header
    description: "Incremental model for order headers containing order metadata and payment details."
    columns:
      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - not_null
          - unique

      - name: order_ts
        description: "Timestamp when the order was placed."

      - name: order_dt_local
        description: "Local date of the order."

      - name: customer_id
        description: "Identifier for the customer who placed the order."
        tests:
          - not_null

      - name: store_id
        description: "Identifier for the store where the order was placed."
        tests:
          - not_null
      - name: order_channel
        description: "Sales channel through which the order was placed."

      - name: payment_method
        description: "Payment method used for the order."

      - name: coupon_code
        description: "Coupon code applied to the order, if any."

      - name: shipping_fee
        description: "Shipping fee charged for the order."

      - name: currency
        description: "Currency used for the transaction."

      - name: ingestion_ts
        description: "Timestamp when the record was ingested into the bronze layer."
        tests:
          - not_null

